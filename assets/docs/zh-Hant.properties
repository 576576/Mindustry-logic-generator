title = MdtC — Mindustry 邏輯程式編輯器
tagline = 一種類 Java 的高階語言，可編譯為 Mindustry 原生邏輯組合語言（`.mdtc` → `.mdtcode`），支援完整的雙向轉換。提供 **CLI** 工具和**遊戲內模組**兩種使用方式。
heading_quickstart = 快速開始
heading_mod = Mindustry 模組
mod_browser_title = 從模組瀏覽器
mod_browser_step1 = 在 Mindustry 中選擇 **模組** → **模組瀏覽器**
mod_browser_step2 = 搜尋 **MdtC** → **安裝**
mod_browser_step3 = 開啟任意處理器 → 點擊底部工具欄的 **MdtC**
mod_browser_step4 = 在左側編輯 `.mdtc`，右側預覽 `.mdtcode`
manual_import_title = 手動匯入
manual_import_step1 = [下載](https://github.com/576576/mdtC/releases) `mdtc-{{VERSION}}-Desktop.jar`
manual_import_step2 = 在 Mindustry 中選擇 **模組** → **匯入模組** → 選擇 JAR 檔案
manual_import_step3 = 之後同上 3–4 步
heading_cli = CLI
cli_ref = 詳見 [CLI 參考](docs/CLI.md)。
