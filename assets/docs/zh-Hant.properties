heading_contributing = 貢獻翻譯
contrib_step1 = 複製 `assets/bundles/en.properties` 為 `assets/bundles/[langCode]-[regionCode].properties`
contrib_step2 = 翻譯所有值 — **鍵名不可更改**
contrib_step3 = （可選）複製 `docs/` 到 `docs/xx/` 並翻譯文件
contrib_step4 = 提交 Pull Request — CI 合入後自動更新 [docs/i18n.md](docs/i18n.md)
