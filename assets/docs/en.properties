heading_contributing = Contributing a Translation
contrib_step1 = Copy `assets/bundles/en.properties` to `assets/bundles/[langCode]-[regionCode].properties`
contrib_step2 = Translate all values — **keys must stay unchanged**
contrib_step3 = (Optional) Copy `docs/` to `docs/xx/` and translate the documentation
contrib_step4 = Submit a Pull Request — CI will auto-update [docs/i18n.md](docs/i18n.md) on merge
