title = MdtC — Mindustry Logic Coder
tagline = A Java-like high-level language that compiles to Mindustry's native logic assembly (`.mdtc` → `.mdtcode`), with full round-trip decompilation support. Available as a **CLI** tool and an **in-game mod**.
heading_quickstart = Quick Start
heading_mod = Mindustry Mod
mod_browser_title = From Mod Browser
mod_browser_step1 = In Mindustry, go to **Mods** → **Mod Browser**
mod_browser_step2 = Search for **MdtC** → **Install**
mod_browser_step3 = Open any processor → click **MdtC** at the bottom toolbar
mod_browser_step4 = Edit `.mdtc` in the left pane, preview `.mdtcode` in the right pane
manual_import_title = Manual Import
manual_import_step1 = [Download](https://github.com/576576/mdtC/releases) `mdtc-{{VERSION}}-Desktop.jar`
manual_import_step2 = In Mindustry, go to **Mods** → **Import Mod** → select the JAR file
manual_import_step3 = Then same as steps 3–4 above
heading_cli = CLI
cli_ref = See [CLI Reference](docs/CLI.md) for instructions.
