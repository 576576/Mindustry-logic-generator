heading_contributing = 贡献翻译
contrib_step1 = 复制 `assets/bundles/en.properties` 为 `assets/bundles/[langCode]-[regionCode].properties`
contrib_step2 = 翻译所有值 — **键名不可更改**
contrib_step3 = （可选）复制 `docs/` 到 `docs/xx/` 并翻译文档
contrib_step4 = 提交 Pull Request — CI 合入后自动更新 [docs/i18n.md](docs/i18n.md)
