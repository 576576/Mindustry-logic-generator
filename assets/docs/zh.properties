feat_roundtrip = 完整双向转换
feat_roundtrip_desc = 编译 `.mdtc` → `.mdtcode` 并支持无损反编译
feat_editor = 双栏编辑器
feat_editor_desc = 在 Mindustry 游戏内边编辑边预览
