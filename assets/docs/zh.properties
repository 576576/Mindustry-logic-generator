title = MdtC — Mindustry 逻辑编程器
tagline = 一种类 Java 的高级语言，可编译为 Mindustry 原生逻辑汇编（`.mdtc` → `.mdtcode`），支持完整的双向转换。提供 **CLI** 工具和**游戏内 Mod** 两种使用方式。
heading_quickstart = 快速开始
heading_mod = Mindustry 模组
mod_browser_title = 从模组浏览器
mod_browser_step1 = 在 Mindustry 中选择 **模组** → **模组浏览器**
mod_browser_step2 = 搜索 **MdtC** → **安装**
mod_browser_step3 = 打开任意处理器 → 点击底部工具栏的 **MdtC**
mod_browser_step4 = 在左侧编辑 `.mdtc`，右侧预览 `.mdtcode`
manual_import_title = 手动导入
manual_import_step1 = [下载](https://github.com/576576/mdtC/releases) `mdtc-{{VERSION}}-Desktop.jar`
manual_import_step2 = 在 Mindustry 中选择 **模组** → **导入模组** → 选择 JAR 文件
manual_import_step3 = 之后同上 3–4 步
heading_cli = CLI
cli_ref = 详见 [CLI 参考](docs/CLI.md)。
