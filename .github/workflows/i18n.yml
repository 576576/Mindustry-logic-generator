name: i18n Status

on:
  push:
    paths:
      - 'assets/bundles/**'
      - 'docs/**'
    branches: [main, master]
  pull_request:
    paths:
      - 'assets/bundles/**'
      - 'docs/**'
    branches: [main, master]

permissions:
  contents: write

jobs:
  update-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect languages
        id: detect
        run: |
          echo "# MdtC i18n Language Status" > i18n.md
          echo "" >> i18n.md
          echo "> Auto-generated by [CI]{.github/workflows/i18n.yml} — last updated $(date -u +'%Y-%m-%d %H:%M UTC')" >> i18n.md
          echo "" >> i18n.md
          echo "## Supported Languages" >> i18n.md
          echo "" >> i18n.md

          # Count keys in default bundle (exclude header lines lang= and code=)
          DEFAULT_KEYS=$(grep -c '^mdtc\.' assets/bundles/bundle.properties || echo 0)

          # English doc count: docs/*.md + README.md at root
          DEFAULT_DOCS=$(( $(find docs -maxdepth 1 -name '*.md' | wc -l) + 1 ))

          echo "| Language | Code | Coverage | Document | Status |" >> i18n.md
          echo "|----------|------|----------|----------|--------|" >> i18n.md

          for f in assets/bundles/bundle*.properties; do
            BASENAME=$(basename "$f" .properties)

            # Read lang and code from file headers
            LANG=$(grep '^lang = ' "$f" | sed 's/^lang = //')
            CODE=$(grep '^code = ' "$f" | sed 's/^code = //')

            if [ -z "$LANG" ]; then
              if [ "$BASENAME" = "bundle" ]; then LANG="English"; CODE="en"
              else LANG="$BASENAME"; CODE="$BASENAME"; fi
            fi

            # Count translation keys
            KEYS=$(grep -c '^mdtc\.' "$f" || echo 0)
            if [ "$DEFAULT_KEYS" -gt 0 ]; then
              PCT=$((100 * KEYS / DEFAULT_KEYS))
            else
              PCT=100
            fi

            # Build readme link
            if [ "$CODE" = "en" ]; then
              README_LINK="README.md"
            else
              README_LINK="docs/$CODE/README.md"
            fi

            # Count translated docs
            if [ "$CODE" = "en" ]; then
              DOCS=$DEFAULT_DOCS
            else
              DOC_DIR="docs/$CODE"
              DOCS=$(find "$DOC_DIR" -maxdepth 1 -name '*.md' 2>/dev/null | wc -l)
              # zh_CN also has its own README
              if [ "$DOCS" -gt 0 ]; then DOCS=$((DOCS)); fi
            fi
            DOC_PCT=$((100 * DOCS / DEFAULT_DOCS))
            if [ "$DOC_PCT" -gt 100 ]; then DOC_PCT=100; fi

            # Combined status
            COMBINED=$(( (PCT + DOC_PCT) / 2 ))
            if [ "$COMBINED" -ge 100 ]; then STATUS="✅"
            elif [ "$COMBINED" -ge 50 ]; then STATUS="⚠️"
            else STATUS="❌"
            fi

            COVERAGE="$KEYS/$DEFAULT_KEYS ($PCT%)"
            DOC_COVERAGE="$DOCS/$DEFAULT_DOCS ($DOC_PCT%)"

            echo "| [$LANG]($README_LINK) | \`$CODE\` | $COVERAGE | $DOC_COVERAGE | $STATUS |" >> i18n.md
          done

          echo "" >> i18n.md
          echo "## Contributing a Translation" >> i18n.md
          echo "" >> i18n.md
          echo "1. Copy \`assets/bundles/bundle.properties\` to \`assets/bundles/bundle_xx_XX.properties\`" >> i18n.md
          echo "2. Edit the header: \`lang = Your Language\`, \`code = xx_XX\`" >> i18n.md
          echo "3. Translate the values (keys must remain unchanged)" >> i18n.md
          echo "4. For documentation, copy \`docs/\` files to \`docs/xx_XX/\` and translate" >> i18n.md
          echo "5. Submit a Pull Request" >> i18n.md

      - name: Commit i18n.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add i18n.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update i18n status [skip ci]"
            git push
          fi
