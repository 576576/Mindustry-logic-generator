name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Build CLI JAR
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        run: ./gradlew jarMod

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Cli
          path: build/libs/mdtc-*-Cli.jar

      - name: Upload Desktop Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Desktop
          path: build/libs/mdtc-*-Desktop.jar

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build CLI JAR
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        run: ./gradlew jarMod

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/mdtc-*-Cli.jar
            build/libs/mdtc-*-Desktop.jar
          generate_release_notes: true
