name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Build CLI JAR
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        run: ./gradlew jarMod

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Cli
          path: build/libs/mdtc-*-Cli.jar

      - name: Upload Desktop Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Desktop
          path: build/libs/mdtc-*-Desktop.jar

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qE '^release-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Release $VERSION" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE '^beta-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION-beta" >> $GITHUB_OUTPUT
            echo "release_name=Beta $VERSION" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "tag=alpha-latest" >> $GITHUB_OUTPUT
            echo "release_name=Alpha ($SHORT_SHA)" >> $GITHUB_OUTPUT
          fi

      - name: Update version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Setting version to: $VERSION"

          # Update gradle.properties
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties

          # Update mod.hjson
          sed -i "s/^version:.*/version: $VERSION/" mod.hjson

          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "=== mod.hjson ==="
          cat mod.hjson

      - name: Build CLI JAR
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        run: ./gradlew jarMod

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ${{ github.event.head_commit.message }}
          files: |
            build/libs/mdtc-*-Cli.jar
            build/libs/mdtc-*-Desktop.jar
          generate_release_notes: true
          make_latest: true
