name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      release_name: ${{ steps.detect.outputs.release_name }}
      is_stable: ${{ steps.detect.outputs.is_stable }}
      build_cli: ${{ steps.detect.outputs.build_cli }}
      build_mod: ${{ steps.detect.outputs.build_mod }}
      i18n_do: ${{ steps.hash-check.outputs.do_i18n }}
      docs_do: ${{ steps.hash-check.outputs.do_docs }}
      bundles_hash: ${{ steps.hash-check.outputs.bundles_hash }}
      docs_hash: ${{ steps.hash-check.outputs.docs_hash }}
      templates_hash: ${{ steps.hash-check.outputs.templates_hash }}
      root_lang: ${{ steps.hash-check.outputs.root_lang }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect flags & version
        id: detect
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # ---- Build targets (default: all) ----
          BUILD_CLI=true
          BUILD_MOD=true
          if echo "$COMMIT_MSG" | grep -qw 'b-cli';  then BUILD_MOD=false; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-mod';  then BUILD_CLI=false; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-all';  then BUILD_CLI=true; BUILD_MOD=true; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-none'; then BUILD_CLI=false; BUILD_MOD=false; fi
          echo "build_cli=$BUILD_CLI" >> $GITHUB_OUTPUT
          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT

          # ---- Version ----
          if echo "$COMMIT_MSG" | grep -qE '(^|\s)(r|release)-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE '(^|\s)(r|release)-[0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Release $VERSION" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE '(^|\s)beta-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE 'beta-[0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION-beta" >> $GITHUB_OUTPUT
            echo "release_name=Beta $VERSION" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "tag=nightly-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "release_name=Nightly ($SHORT_SHA)" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Check i18n & docs changes
        id: hash-check
        env:
          MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          BUNDLES_HASH=$(find assets/bundles -type f -name '*.properties' ! -name 'bundle.properties' -exec sha256sum {} \; | sort | sha256sum | cut -c1-8)
          DOCS_HASH=$(find assets/docs -type f -name '*.json' -exec sha256sum {} \; | sort | sha256sum | cut -c1-8)
          TEMPLATES_HASH=$(find assets/templates assets/.i18n_config -type f -exec sha256sum {} \; 2>/dev/null | sort | sha256sum | cut -c1-8)

          # Read root_lang from independent i18n config (default: en)
          ROOT_LANG=$(awk -F: '/^[[:space:]]*root_lang[[:space:]]*:/{gsub(/[[:space:]"]/,"",$2); print $2; exit}' assets/.i18n_config/i18n.yml 2>/dev/null)
          ROOT_LANG=${ROOT_LANG:-en}
          echo "root_lang=$ROOT_LANG" >> $GITHUB_OUTPUT

          # b-doc: force i18n + docs regeneration
          if echo "$MSG" | grep -qE '\bb-doc\b'; then
            echo "do_i18n=true" >> $GITHUB_OUTPUT
            echo "do_docs=true" >> $GITHUB_OUTPUT
            echo "bundles_hash=$BUNDLES_HASH" >> $GITHUB_OUTPUT
            echo "docs_hash=$DOCS_HASH" >> $GITHUB_OUTPUT
            echo "templates_hash=$TEMPLATES_HASH" >> $GITHUB_OUTPUT
            echo "i18n: true (forced)  docs: true (forced)"
            exit 0
          fi

          OLD_BUNDLES=""; OLD_DOCS=""; OLD_TEMPLATES=""
          if [ -f docs/i18n.md ]; then
            OLD_BUNDLES=$(grep 'bundles:' docs/i18n.md | tail -1 | awk '{print $2}')
            OLD_DOCS=$(grep 'docs:' docs/i18n.md | tail -1 | awk '{print $2}')
            OLD_TEMPLATES=$(grep 'templates:' docs/i18n.md | tail -1 | awk '{print $2}')
          fi

          DO_I18N="false"; DO_DOCS="false"
          [ "$TEMPLATES_HASH" != "$OLD_TEMPLATES" ] && DO_I18N="true" && DO_DOCS="true"
          [ "$BUNDLES_HASH" != "$OLD_BUNDLES" ] && DO_I18N="true"
          [ "$DOCS_HASH" != "$OLD_DOCS" ] && DO_I18N="true"
          [ "$DOCS_HASH" != "$OLD_DOCS" ] && DO_DOCS="true"

          echo "do_i18n=$DO_I18N" >> $GITHUB_OUTPUT
          echo "do_docs=$DO_DOCS" >> $GITHUB_OUTPUT
          echo "bundles_hash=$BUNDLES_HASH" >> $GITHUB_OUTPUT
          echo "docs_hash=$DOCS_HASH" >> $GITHUB_OUTPUT
          echo "templates_hash=$TEMPLATES_HASH" >> $GITHUB_OUTPUT
          echo "i18n: $DO_I18N  docs: $DO_DOCS"

      - name: Update version files
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          echo "Setting version to: $VERSION"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          sed -i "s/^version:.*/version: $VERSION/" mod.hjson
          sed -i "s/^version=.*/version=$VERSION/" src/main/resources/version.properties

      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            gradle.properties
            mod.hjson
            src/main/resources/version.properties

  i18n:
    needs: prebuild
    if: needs.prebuild.result == 'success' && (needs.prebuild.outputs.i18n_do == 'true' || needs.prebuild.outputs.docs_do == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate i18n status
        if: needs.prebuild.outputs.i18n_do == 'true'
        run: |
          TEMPLATE="assets/templates/i18n.md"
          OUTPUT="docs/i18n.md"
          DEFAULT="assets/bundles/en.properties"
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          ROOT_LANG="${{ needs.prebuild.outputs.root_lang }}"
          ROOT_LANG=${ROOT_LANG:-en}

          HEADER_KEYS=4
          DEFAULT_TOTAL=$(grep -c '^mdtc\.' "$DEFAULT" || echo 0)

          ROWS=""
          for f in $(ls assets/bundles/*.properties | sort -r); do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue

            LANG=$(grep '^lang = ' "$f" | sed 's/^lang = //')
            CODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            REGION=$(grep '^langRegion = ' "$f" | sed 's/^langRegion = //')
            [ -z "$REGION" ] && REGION="—"

            KEYS=$(grep -c '^mdtc\.' "$f" || echo 0)
            PCT=$(( DEFAULT_TOTAL > 0 ? 100 * KEYS / DEFAULT_TOTAL : 100 ))
            [ "$PCT" -gt 100 ] && PCT=100

            DOCS=0
            if [ "$BASENAME" = "$ROOT_LANG" ]; then
              DOCS=$(ls docs/*.md 2>/dev/null | wc -l)
              [ -f README.md ] && DOCS=$((DOCS + 1))
            fi
            if [ -d "docs/$BASENAME" ]; then
              DOCS=$((DOCS + $(find "docs/$BASENAME" -name '*.md' 2>/dev/null | wc -l)))
            fi
            HAS_DOC=""
            [ -f "assets/docs/$BASENAME.json" ] && HAS_DOC=" 📄"

            README_LINK="$BASENAME/README.md"

            ROWS="$ROWS| [$LANG]($README_LINK) | \`$CODE\` | $REGION | $KEYS/$DEFAULT_TOTAL ($PCT%) | $DOCS$HAS_DOC |\n"
          done

          cp "$TEMPLATE" "$OUTPUT"
          sed -i "s#{{date}}#$NOW#" "$OUTPUT"
          sed -i "s#{{rows}}#$ROWS#" "$OUTPUT"
          sed -i "s#{{bundles_hash}}#${{ needs.prebuild.outputs.bundles_hash }}#" "$OUTPUT"
          sed -i "s#{{docs_hash}}#${{ needs.prebuild.outputs.docs_hash }}#" "$OUTPUT"
          sed -i "s#{{templates_hash}}#${{ needs.prebuild.outputs.templates_hash }}#" "$OUTPUT"
          echo "=== Generated docs/i18n.md ==="

      - name: Generate READMEs
        if: needs.prebuild.outputs.docs_do == 'true'
        env:
          ROOT_LANG: ${{ needs.prebuild.outputs.root_lang }}
        run: python3 .github/workflows/render_readme.py

      - name: Generate bundle.properties
        if: needs.prebuild.outputs.i18n_do == 'true'
        run: |
          INDEX="assets/bundles/bundle.properties"
          echo "# MdtC Bundle Index" > "$INDEX"
          echo "# This file is auto-generated by CI, it must be version-controlled and must NOT be edited manually." >> "$INDEX"
          echo "# Format: {langCode}.{regionCode} = bundleFileName" >> "$INDEX"
          echo "#          {langCode} = bundleFileName (region-less fallback)" >> "$INDEX"
          echo "# Region entries are only emitted when a langCode has multiple files" >> "$INDEX"
          echo "# and the target differs from the base." >> "$INDEX"

          declare -A LANG_FILES
          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LC=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            [ -z "$LC" ] && continue
            LANG_FILES["$LC"]=$((${LANG_FILES["$LC"]:-0} + 1))
          done

          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LANGCODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            [ "$BASENAME" = "$LANGCODE" ] && echo "$LANGCODE = $BASENAME" >> "$INDEX"
          done

          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LANGCODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            REGIONS=$(grep '^langRegionCode = ' "$f" | sed 's/^langRegionCode = //')
            [ -z "$LANGCODE" ] && continue

            if [ "${LANG_FILES[$LANGCODE]}" -gt 1 ] && [ -n "$REGIONS" ] && [ "$BASENAME" != "$LANGCODE" ]; then
              IFS=',' read -ra RARR <<< "$REGIONS"
              for r in "${RARR[@]}"; do
                r=$(echo "$r" | xargs)
                [ -n "$r" ] && echo "$LANGCODE.$r = $BASENAME" >> "$INDEX"
              done
            fi
          done
          echo "=== Generated bundle.properties ==="
          cat "$INDEX"

      - name: Upload i18n artifacts
        if: needs.prebuild.outputs.i18n_do == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-files
          path: |
            docs/i18n.md
            assets/bundles/bundle.properties
            README.md
            docs/*/README.md

  commit:
    needs: [i18n, prebuild]
    if: needs.i18n.result == 'success' && (needs.prebuild.outputs.i18n_do == 'true' || needs.prebuild.outputs.docs_do == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Download i18n artifacts
        uses: actions/download-artifact@v4
        with:
          name: i18n-files

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties mod.hjson src/main/resources/version.properties docs/i18n.md assets/bundles/bundle.properties README.md docs/*/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: update version & i18n [skip ci]"
            git push
          fi

  build:
    needs: [commit, prebuild]
    if: ${{ !cancelled() && (needs.prebuild.outputs.build_cli == 'true' || needs.prebuild.outputs.build_mod == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Build & Test
        run: ./gradlew build

      - name: Build CLI JAR
        if: needs.prebuild.outputs.build_cli == 'true'
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        if: needs.prebuild.outputs.build_mod == 'true'
        run: ./gradlew jarMod

      - name: Upload CLI JAR
        if: needs.prebuild.outputs.build_cli == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Cli
          path: build/libs/mdtc-*-Cli.jar

      - name: Upload Desktop Mod JAR
        if: needs.prebuild.outputs.build_mod == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Desktop
          path: build/libs/mdtc-*-Desktop.jar

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

  release:
    needs: [build, prebuild]
    if: needs.build.result == 'success' && needs.prebuild.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing release (if any)
        run: |
          TAG="${{ needs.prebuild.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting existing release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: mdtc-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prebuild.outputs.tag }}
          name: ${{ needs.prebuild.outputs.release_name }}
          body: |
            ${{ github.event.head_commit.message }}
          files: ./dist/*
          generate_release_notes: true
          make_latest: true

  nightly:
    needs: [build, prebuild]
    if: needs.build.result == 'success' && needs.prebuild.outputs.is_stable == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing nightly
        run: |
          if gh release view "nightly" &>/dev/null; then
            echo "Deleting existing nightly"
            gh release delete "nightly" --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: mdtc-*
          merge-multiple: true

      - name: Create Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ${{ needs.prebuild.outputs.release_name }}
          body: |
            ${{ github.event.head_commit.message }}
          files: ./dist/*
          prerelease: true
          make_latest: false
