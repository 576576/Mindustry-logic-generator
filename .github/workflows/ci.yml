name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  prebuild:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      release_name: ${{ steps.detect.outputs.release_name }}
      is_stable: ${{ steps.detect.outputs.is_stable }}
      build_cli: ${{ steps.detect.outputs.build_cli }}
      build_mod: ${{ steps.detect.outputs.build_mod }}
      i18n_changed: ${{ steps.detect.outputs.i18n_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect flags & version
        id: detect
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # ---- Build targets (default: all) ----
          BUILD_CLI=true
          BUILD_MOD=true
          if echo "$COMMIT_MSG" | grep -qw 'b-cli';  then BUILD_MOD=false; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-mod';  then BUILD_CLI=false; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-all';  then BUILD_CLI=true; BUILD_MOD=true; fi
          if echo "$COMMIT_MSG" | grep -qw 'b-none'; then BUILD_CLI=false; BUILD_MOD=false; fi
          echo "build_cli=$BUILD_CLI" >> $GITHUB_OUTPUT
          echo "build_mod=$BUILD_MOD" >> $GITHUB_OUTPUT

          # ---- Version ----
          if echo "$COMMIT_MSG" | grep -qE '(^|\s)(r|release)-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE '(^|\s)(r|release)-[0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Release $VERSION" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE '(^|\s)beta-[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oE 'beta-[0-9]+\.[0-9]+\.[0-9]+' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION-beta" >> $GITHUB_OUTPUT
            echo "release_name=Beta $VERSION" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "tag=nightly-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "release_name=Nightly ($SHORT_SHA)" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT
          fi

          # ---- i18n lazy: hash source files, compare with stored hashes ----
          B_HASH=$(sha256sum assets/bundles/en.properties assets/bundles/zh.properties assets/bundles/zh-Hant.properties assets/bundles/fr.properties assets/bundles/ja.properties 2>/dev/null | sha256sum | cut -d' ' -f1)
          D_HASH=$(sha256sum assets/docs/en.properties assets/docs/zh.properties assets/docs/zh-Hant.properties 2>/dev/null | sha256sum | cut -d' ' -f1)
          T_HASH=$(sha256sum assets/templates/README.md assets/templates/i18n.md 2>/dev/null | sha256sum | cut -d' ' -f1)
          OLD_B=$(grep '^> bundles:' docs/i18n.md 2>/dev/null | sed 's/> bundles: *//' || echo "")
          OLD_D=$(grep '^> docs:' docs/i18n.md 2>/dev/null | sed 's/> docs: *//' || echo "")
          OLD_T=$(grep '^> templates:' docs/i18n.md 2>/dev/null | sed 's/> templates: *//' || echo "")
          if [ "$B_HASH" != "$OLD_B" ] || [ "$D_HASH" != "$OLD_D" ] || [ "$T_HASH" != "$OLD_T" ]; then
            echo "i18n_changed=true" >> $GITHUB_OUTPUT
            echo "i18n hash changed"
          else
            echo "i18n_changed=false" >> $GITHUB_OUTPUT
            echo "i18n hash unchanged, skipping"
          fi

      - name: Update version files
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          echo "Setting version to: $VERSION"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          sed -i "s/^version:.*/version: $VERSION/" mod.hjson
          sed -i "s/^version=.*/version=$VERSION/" src/main/resources/version.properties

      - name: Upload version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            gradle.properties
            mod.hjson
            src/main/resources/version.properties

  i18n:
    needs: prebuild
    if: github.event_name == 'push' && needs.prebuild.outputs.i18n_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate i18n.md
        run: |
          ROWS_FILE=$(mktemp)
          mkdir -p docs

          DEFAULT_KEYS=$(grep -c '^mdtc\.' assets/bundles/en.properties || echo 0)
          DEFAULT_DOCS=$(( $(find docs -maxdepth 1 -name '*.md' | wc -l) + 1 ))

          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue

            LANG=$(grep '^lang = ' "$f" | sed 's/^lang = //')
            CODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            REGION=$(grep '^langRegion = ' "$f" | sed 's/^langRegion = //')
            [ -z "$LANG" ] && { [ "$BASENAME" = "en" ] && LANG="English" || LANG="$BASENAME"; }
            [ -z "$REGION" ] && REGION="—"

            KEYS=$(grep -c '^mdtc\.' "$f" || echo 0)
            PCT=$(( DEFAULT_KEYS > 0 ? 100 * KEYS / DEFAULT_KEYS : 100 ))

            if [ "$CODE" = "en" ]; then
              README_LINK="README.md"; DOCS=$DEFAULT_DOCS
            else
              README_LINK="docs/$BASENAME/README.md"
              DOCS=$(find "docs/$BASENAME" -maxdepth 1 -name '*.md' 2>/dev/null | wc -l)
            fi
            DOC_PCT=$((100 * DOCS / DEFAULT_DOCS))
            [ "$DOC_PCT" -gt 100 ] && DOC_PCT=100

            STATUS="✅"
            [ "$PCT" -lt 100 ] && STATUS="⚠️"
            [ "$PCT" -lt 50 ] && STATUS="❌"

            echo "| [$LANG]($README_LINK) | \`$CODE\` | $REGION | $KEYS/$DEFAULT_KEYS ($PCT%) | $DOCS/$DEFAULT_DOCS ($DOC_PCT%) $STATUS |" >> "$ROWS_FILE"
          done

          B_HASH=$(sha256sum assets/bundles/en.properties assets/bundles/zh.properties assets/bundles/zh-Hant.properties assets/bundles/fr.properties assets/bundles/ja.properties 2>/dev/null | sha256sum | cut -d' ' -f1)
          D_HASH=$(sha256sum assets/docs/en.properties assets/docs/zh.properties assets/docs/zh-Hant.properties 2>/dev/null | sha256sum | cut -d' ' -f1)
          T_HASH=$(sha256sum assets/templates/README.md assets/templates/i18n.md 2>/dev/null | sha256sum | cut -d' ' -f1)

          sed -e "s|{{date}}|$(date -u +'%Y-%m-%d %H:%M UTC')|g" \
              -e "s|{{bundles_hash}}|$B_HASH|g" \
              -e "s|{{docs_hash}}|$D_HASH|g" \
              -e "s|{{templates_hash}}|$T_HASH|g" \
              -e "/{{rows}}/{
                r $ROWS_FILE
                d
              }" \
              assets/templates/i18n.md > docs/i18n.md

          rm "$ROWS_FILE"
          echo "=== Generated docs/i18n.md (hash: $I18N_HASH) ==="

      - name: Generate bundle.properties
        run: |
          INDEX="assets/bundles/bundle.properties"
          echo "# MdtC Bundle Index" > "$INDEX"
          echo "# This file is auto-generated by CI, it must be version-controlled and must NOT be edited manually." >> "$INDEX"
          echo "# Format: {langCode}.{regionCode} = bundleFileName" >> "$INDEX"
          echo "#          {langCode} = bundleFileName (region-less fallback)" >> "$INDEX"
          echo "# Region entries are only emitted when a langCode has multiple files" >> "$INDEX"
          echo "# and the target differs from the base." >> "$INDEX"

          declare -A LANG_FILES
          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LC=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            [ -z "$LC" ] && continue
            LANG_FILES["$LC"]=$((${LANG_FILES["$LC"]:-0} + 1))
          done

          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LANGCODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            [ "$BASENAME" = "$LANGCODE" ] && echo "$LANGCODE = $BASENAME" >> "$INDEX"
          done

          for f in assets/bundles/*.properties; do
            BASENAME=$(basename "$f" .properties)
            [ "$BASENAME" = "bundle" ] && continue
            LANGCODE=$(grep '^langCode = ' "$f" | sed 's/^langCode = //')
            REGIONS=$(grep '^langRegionCode = ' "$f" | sed 's/^langRegionCode = //')
            [ -z "$LANGCODE" ] && continue

            if [ "${LANG_FILES[$LANGCODE]}" -gt 1 ] && [ -n "$REGIONS" ] && [ "$BASENAME" != "$LANGCODE" ]; then
              IFS=',' read -ra RARR <<< "$REGIONS"
              for r in "${RARR[@]}"; do
                r=$(echo "$r" | xargs)
                [ -n "$r" ] && echo "$LANGCODE.$r = $BASENAME" >> "$INDEX"
              done
            fi
          done
          echo "=== Generated bundle.properties ==="
          cat "$INDEX"

      - name: Generate README.md
        run: |
          VERSION="${{ needs.prebuild.outputs.version }}"
          TEMPLATE="assets/templates/README.md"

          LANGS=""
          for DOC in assets/docs/*.properties; do
            LANG=$(grep '^lang = ' "$DOC" | sed 's/^lang = //')
            LANGCODE=$(grep '^langCode = ' "$DOC" | sed 's/^langCode = //')
            BASENAME=$(basename "$DOC" .properties)
            if [ "$LANGCODE" = "en" ]; then
              LINK="README.md"
            else
              LINK="docs/$BASENAME/README.md"
            fi
            [ -n "$LANGS" ] && LANGS="$LANGS | "
            LANGS="${LANGS}__${BASENAME}__[${LANG}](${LINK})"
          done

          for DOC in assets/docs/*.properties; do
            BASENAME=$(basename "$DOC" .properties)
            LANGCODE=$(grep '^langCode = ' "$DOC" | sed 's/^langCode = //')

            LANG_BAR=$(echo "$LANGS" | sed "s|__${BASENAME}__\[\([^]]*\)\]\(([^)]*)\)|[**\1**]\2|g" | sed 's|__[a-zA-Z-]*__||g')

            if [ "$LANGCODE" = "en" ]; then
              OUT="README.md"
              ICON_PREFIX=""
            else
              mkdir -p "docs/$BASENAME"
              OUT="docs/$BASENAME/README.md"
              ICON_PREFIX="../../"
            fi

            SED_SCRIPT="s#{{VERSION}}#$VERSION#g;s#{{languages}}#$LANG_BAR#g;s#{{icon_prefix}}#$ICON_PREFIX#g"
            while IFS='=' read -r key value; do
              key=$(echo "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              value=$(echo "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              [ -z "$key" ] && continue
              case "$key" in lang|langCode|langRegion|langRegionCode|title) continue ;; esac
              value_esc=$(echo "$value" | sed 's/[#\\&]/\\&/g')
              SED_SCRIPT="$SED_SCRIPT;s#{{${key}}}#${value_esc}#g"
            done < "$DOC"

            sed "$SED_SCRIPT" "$TEMPLATE" > "$OUT"
            echo "Generated $OUT"
          done

      - name: Upload i18n artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i18n-files
          path: |
            docs/i18n.md
            assets/bundles/bundle.properties
            README.md
            docs/*/README.md

  commit:
    needs: i18n
    if: always() && needs.prebuild.outputs.i18n_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Download i18n artifacts
        uses: actions/download-artifact@v4
        with:
          name: i18n-files

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties mod.hjson src/main/resources/version.properties docs/i18n.md assets/bundles/bundle.properties README.md docs/*/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: update version & i18n [skip ci]"
            git push
          fi

  build:
    needs: commit
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - name: Build & Test
        run: ./gradlew build

      - name: Build CLI JAR
        if: needs.prebuild.outputs.build_cli == 'true'
        run: ./gradlew shadowJar

      - name: Build Desktop Mod JAR
        if: needs.prebuild.outputs.build_mod == 'true'
        run: ./gradlew jarMod

      - name: Upload CLI JAR
        if: needs.prebuild.outputs.build_cli == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Cli
          path: build/libs/mdtc-*-Cli.jar

      - name: Upload Desktop Mod JAR
        if: needs.prebuild.outputs.build_mod == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mdtc-Desktop
          path: build/libs/mdtc-*-Desktop.jar

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

  release:
    needs: build
    if: success() && needs.prebuild.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing release (if any)
        run: |
          TAG="${{ needs.prebuild.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting existing release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: mdtc-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prebuild.outputs.tag }}
          name: ${{ needs.prebuild.outputs.release_name }}
          body: |
            ${{ github.event.head_commit.message }}
          files: ./dist/*
          generate_release_notes: true
          make_latest: true

  nightly:
    needs: build
    if: success() && needs.prebuild.outputs.is_stable == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing nightly
        run: |
          if gh release view "nightly" &>/dev/null; then
            echo "Deleting existing nightly"
            gh release delete "nightly" --yes --cleanup-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: mdtc-*
          merge-multiple: true

      - name: Create Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: ${{ needs.prebuild.outputs.release_name }}
          body: |
            ${{ github.event.head_commit.message }}
          files: ./dist/*
          prerelease: true
          make_latest: false
